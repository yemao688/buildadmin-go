# golangci-lint v2 配置（对应 golangci-lint v2.15.x + golangci-lint-action@v9）。
#
# 分档策略：档 A/B/C 全部纳入门禁并保持全绿；新增 linter 前必须先清空存量
# 命中，不要把红牌塞进流水线。
#
# 档 A（正确性底座，0 条）：govet / ineffassign / unused / staticcheck 的 S 类。
# 档 B（已清空，曾 199 条）：errcheck（默认设置）/ errorlint / nilerr /
#   forcetypeassert / misspell / predeclared / errname / thelper / 精选 staticcheck。
# 档 C（已全部清空）：第 1 批 testifylint、第 2 批 gosec、第 3 批 gocritic（仅
#   diagnostic）、第 4 批 revive（排除 exported / var-naming）、第 5 批
#   paralleltest（全局状态测试逐条立据）、第 6 批 gocyclo（min-complexity 15）。

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # --- 档 A ---
    - govet
    - ineffassign
    - unused
    - staticcheck

    # --- 档 B ---
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - misspell
    - predeclared
    - errname
    - thelper

    # --- 档 C（逐批开启）：第 1 批 testifylint ---
    - testifylint

    # --- 档 C（逐批开启）：第 2 批 gosec ---
    - gosec

    # --- 档 C（逐批开启）：第 3 批 gocritic（仅 diagnostic）---
    - gocritic

    # --- 档 C（逐批开启）：第 4 批 revive（排除 exported / var-naming）---
    - revive

    # --- 档 C：第 5 批 paralleltest ---
    - paralleltest

    # --- 档 C：第 6 批 gocyclo（min-complexity 15）---
    - gocyclo

  settings:
    # staticcheck：保留 S/SA 类正确性检查，关掉 ST1*/QF1* 纯风格重构建议
    # （QT 风格化、QF 快速修复在存量代码上是噪音），并豁免 SA1029
    # （仓库约定用 string 作 context key，与 Gin / 中间件透传口径一致）。
    staticcheck:
      checks: ["all", "-ST1*", "-QF1*", "-SA1029"]

    # 刻意不开 check-blank / check-type-assertions：本仓库大量 `_ = recordCrudError(...)`、
    # `_ = tx.AddError(...)` 是显式忽略，开了会把 84 条推到 201 条且全是噪音。
    errcheck: {}

    # gocritic 只开 correctness（diagnostic 标签）；style/performance 是存量改写
    # 习惯，收益低于 review 成本，留待单独评估。
    gocritic:
      disabled-tags: ["style", "performance"]

    # revive：显式列出默认规则集并剔除 exported 与 var-naming。
    # golangci-lint 一旦配置 rules 就替换 revive 默认集，所以要逐条列全。
    # - exported 不为存量导出标识符补注释（AGENTS.md 口径），故排除。
    # - var-naming 的命中含 PHP 上游继承命名（如 CdnUrlParams），同时是 Vue
    #   前端 JSON 契约，改名即破坏 API，故排除。
    # 新增规则前必须先清空存量，否则等于把红牌塞回流水线。
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    # gocyclo：阈值固定 15；超阈值函数应拆分，不要提高阈值或大范围 nolint。
    gocyclo:
      min-complexity: 15

    misspell:
      # 统一美式拼写，避免不同人写出两套。
      locale: US
      # 第三方模块路径固定为 github.com/unknwon/com，改名会破坏依赖解析。
      ignore-rules:
        - unknwon

  exclusions:
    # 生成器产物（handler/repository/registrar）按模板形状生成，格式问题不在这里治。
    generated: lax
    rules:
      # 测试里的错误忽略（w.Write、snapshot.Cleanup 等）不强制逐条处理。
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
