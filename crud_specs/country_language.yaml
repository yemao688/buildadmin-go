name: country_language
comment: 全局语言
type: alter
generateRelativePath: country_language
dataScope:
  mode: none
quickSearchField: [lan, name]
menu:
  title: 语言管理
fields:
  - name: id
    type: bigint
    unsigned: true
    primaryKey: true
    autoIncrement: true
    null: false
    designType: pk
    comment: ID
  - name: lan
    type: varchar
    length: 20
    null: false
    defaultType: EMPTY STRING
    comment: 语言代码
  - name: name
    type: varchar
    length: 50
    null: false
    defaultType: EMPTY STRING
    comment: 语言名称
  - name: remark
    type: varchar
    length: 255
    null: false
    defaultType: EMPTY STRING
    comment: 备注
  - name: status
    type: tinyint
    unsigned: true
    null: false
    defaultType: INPUT
    default: "1"
    comment: 状态:0=禁用,1=启用
  - name: weigh
    type: int
    null: false
    defaultType: INPUT
    default: "0"
    comment: 权重
