# 当前源码的本地开发覆盖配置。
services:
  buildadmin-go:
    image: ${REGISTRY_IMAGE_NAME:-buildadmin-go}:dev
    pull_policy: never
    build:
      context: .
      args:
        # 构建期加速与版本字段；未注入时用 dev/unknown 兜底，插值不依赖 .env。
        BUILD_BASE_REGISTRY: ${BUILD_BASE_REGISTRY:-docker.m.daocloud.io/}
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TS: ${BUILD_TS:-unknown}
    restart: no
