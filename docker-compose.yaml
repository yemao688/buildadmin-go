services:
  buildadmin-go:
    image: ${DEPLOY_REGISTRY}/${DEPLOY_IMAGE_NAME}:${DEPLOY_IMAGE_TAG:-latest}
    pull_policy: always
    user: "1000:1000"
    environment:
      APP_PORT: ${APP_PORT:-9989}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-9989}:${APP_PORT:-9989}"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${APP_PORT:-9989}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
