# 固定 compose project 名（默认取目录名）：容器名为 <name>_<service>_1，
# 不随运行目录/面板注入的 project 变化；与 DEPLOY_IMAGE_NAME 一致便于识别。
name: ${DEPLOY_IMAGE_NAME:-buildadmin-go}

services:
  buildadmin-go:
    image: ${DEPLOY_REGISTRY:-registry.example.com}/${DEPLOY_IMAGE_NAME:-buildadmin-go}:${DEPLOY_IMAGE_TAG:-latest}
    pull_policy: always
    user: "1000:1000"
    environment:
      # 容器内端口固定 9900（镜像 EXPOSE 与代码兜底一致）；APP_PORT 只作为
      # 宿主机映射端口（host:9900），不再注入容器。
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-9900}:9900"
    volumes:
      - ./configs:/app/configs
      - ./runtime:/app/runtime
      - ./public:/app/public
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://127.0.0.1:9900/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - 1panel-network
networks:
  1panel-network:
    external: true
