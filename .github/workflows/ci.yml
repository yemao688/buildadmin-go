# 全量门禁:仅手动触发(gh workflow run ci.yml),不随 push/PR 跑。
# 发布 tag 的流程在 release-image.yml(那边只做 gofmt/build/vet 快校验)。
#
# gofmt 是全仓硬 gate(gofmt -l .):存量漂移已在一次性的格式化提交里清空
# (见 .git-blame-ignore-revs),所以这里不需要"只查改动文件"的例外逻辑。
# 注意 gofmt 随 setup-go 安装的版本走(go.mod 的 1.27.x),与本地版本不同时
# 极少数对齐规则可能不一致——发现 CI 与本地结论相反,先对齐 Go 小版本。

name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: gofmt / lint / build / vet / test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # MySQL 门禁测试（迁移升级、删除、审计、data_scope 等）需要真实数据库；
      # 这里用 root 是为了让 testutil.OpenFixtureDatabase 能创建 <db>_fresh_*。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: buildadmin_go_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # setup-go v6+ 默认把缓存键从 go.sum 改成 go.mod;显式保持 v5 语义。
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          set -eu
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::以下文件未格式化(gofmt -l);本地执行 gofmt -w 后提交"
            exit 1
          fi

      # .golangci.yml 分档启用（档 A+B 全绿，档 C 列在文件末尾注释）；新增检查前先本地跑看命中数。
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - run: go build ./...

      - run: go vet ./...

      # configs/config.yaml 被 gitignore；CI 在测试前写入 mysql_test 段，
      # 让迁移/删除/审计等 MySQL 门禁用例真正执行而不是 SKIP。
      - name: 写入 MySQL 测试配置
        run: |
          cat > configs/config.yaml <<'EOF'
          mysql_test:
              enabled: true
              host: '127.0.0.1'
              port: 3306
              database: 'buildadmin_go_test'
              username: 'root'
              password: 'root'
              charset: 'utf8mb4'
          EOF

      # 不加 -p 1:包间并行(go test 默认按 GOMAXPROCS 并发),墙钟取决于最慢的包。
      - name: 单元测试（含 MySQL 门禁）
        run: go test ./... -count=1 -timeout=55m

  # 前端门禁:独立 job,与 Go 门禁互不阻塞(web 变更与 Go 变更通常不同时出现)。
  # 注意:web/pnpm-lock.yaml 未入库(见根 .gitignore),这里刻意不加 --frozen-lockfile
  # 并禁用 setup-node 的 pnpm 缓存(缓存键依赖 lockfile)。依赖版本在 package.json 全部
  # 精确固定,但传递依赖仍由解析器决定——lockfile 入库后应改为 --frozen-lockfile + cache。
  web:
    name: web lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 版本取 Vite 8 支持的 LTS(vite 8 要求 ^20.19.0 || >=22.12.0)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm install
        run: pnpm install --no-frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
