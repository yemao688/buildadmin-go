# ============================================================
# 应用配置（app）
# 说明：
#   - app.port / app.time_zone 已从 YAML 移除，只认环境变量
#     APP_PORT（默认 9900）与 APP_TIME_ZONE（默认 Asia/Shanghai）
#   - 管理员登录验证码、SSO、登录重试、token 保持时间等安全项
# ============================================================
app:
  env: 'debug'                   # 运行模式: debug=开发调试模式, release=生产模式
  admin_login_captcha: true      # 是否开启管理员登录验证码
  user_login_captcha: true       # 是否开启会员登录验证码
  user_login_retry: 10           # 会员登录失败可重试次数,false则无限
  admin_login_retry: 10          # 管理员登录失败可重试次数,false则无限
  admin_sso: false               # 开启管理员单处登录它处失效
  user_sso: false                # 开启会员单处登录它处失效
  user_token_keep_time: 259200   # 会员登录态保持时间（非刷新token，3天）
  admin_token_keep_time: 259200  # 管理员登录态保持时间（非刷新token，3天）
  auto_write_admin_log: true     # 自动写入管理员操作日志
  default_avatar: '/static/images/avatar.png' # 缺省头像图片路径
  cdn_url: ''                    # 内容分发网络URL，末尾不带`/`
  cdn_url_params: ''             # CDN URL 附加参数
  api_url: 'https://buildadmin.com' # 接口地址
  cors_request_domain: '*' # 跨域请求白名单域名（逗号分隔），支持 *
  docs_enabled: false      # 是否挂载 /docs 静态文档服务（public/docs/，业务图文操作指南），
                           #   默认关闭（不挂载，行为同历史版本）；业务在 configs/config.yaml 覆盖开启
  docs_password: ''        # /docs 访问密码：留空则公开访问；非空时挂载服务端密码门（cookie 放行，
                           #   仅防随意浏览，非安全边界）。可用环境变量 DOCS_PASSWORD 覆盖（机密走环境，
                           #   避免写入仓库或镜像）；docs_enabled 关闭时该值不生效

# 点选验证码配置
click_captcha:
  # 模式:text=文字,icon=图标(若只有icon则适用于国际化站点)
  mode: 'text,icon'
  # 长度
  length: 2
  # 混淆点长度
  confuse_length: 2

# 日志配置（log）
# 说明：lumberjack 轮转日志；max_size 单位 MB，max_age 单位 天
log:
  level: 'info'             # 日志级别: debug/info/warn/error
  root_dir: 'runtime/logs'  # 日志根目录
  format: ''                # 日志输出格式（留空使用默认）
  max_backups: 3            # 保留的最大备份文件数
  max_size: 500             # 单个日志文件大小上限（MB）
  max_age: 28               # 日志文件保留天数（天）
  compress: true            # 是否压缩归档日志

# MySQL 数据库配置（mysql）
mysql:
  driver: 'mysql'              # 数据库驱动
  host: '127.0.0.1'            # 主机地址
  port: 3306                   # 端口
  database: 'buildadmin'       # 数据库名
  username: 'root'             # 用户名
  password: ''                 # 密码
  charset: 'utf8mb4'           # 字符集
  max_idle_conns: 50            # 连接池最大空闲连接数（c=100 压测拐点根因之一：idle 过小导致连接抖动）
  max_open_conns: 300           # 连接池最大打开连接数（并发天花板，MySQL max_connections 需 >= 该值）
  max_idle_time: 300            # 空闲连接回收秒数（<=0 时回退默认 300s）
  conn_max_lifetime: 1800       # 连接最大复用秒数（<=0 时回退默认 1800s，防旧连接老化）
  log_mode: 'info'             # SQL 日志模式
  enable_file_log_writer: true # 是否将 SQL 日志写入文件
  prefix: 'ba_'                # 数据表前缀

# MySQL 集成测试数据库（可选）。开发机自建一次性测试库并授权后启用；
# 未配置或 enabled: false 时，需要真实 MySQL 的测试将统一提示并跳过。
mysql_test:
  enabled: false
  host: '127.0.0.1'
  port: 3306
  database: 'buildadmin_go_test' #推荐名称 业务库名称_test
  username: 'buildadmin_go_test'
  password: ''
  charset: 'utf8mb4'

# 令牌配置（token）
# 说明：token.key 由 setup 安装器生成并写入 configs/config.yaml，此处留空
token:
  default: 'mysql' # 令牌存储驱动
  key: ''          # 令牌密钥（安装时自动生成）
  algo: 'sha256'   # 令牌签名算法

# Redis 配置（redis）
redis:
  host: '127.0.0.1' # 主机地址
  port: 6379        # 端口
  db: 0             # 数据库编号（默认 0）
  password: ''      # 密码
  prefix: ''        # redis key 业务前缀，多应用共用 redis 时避免 key 冲突；留空保持历史 key 格式

# 上传配置（upload）
# 说明：
#   - maxsize 单位: MB（如 10 表示最大 10MB）
#   - 存储模式（local/alioss）及 alioss 的 bucket/access_id/secret_key/url/cdn_url
#     由数据库 ba_config 系统配置（后台"系统配置"页）维护，此处只保留
#     maxsize/savename/mimetype 三个键
upload:
  maxsize: 10 # 单位: MB（10MB）
  savename: '/storage/{topic}/{year}{mon}{day}/{fileName}{fileSha1}{.suffix}' # 保存路径规则
  mimetype: 'jpg,png,bmp,jpeg,gif,webp,zip,rar,xls,xlsx,doc,docx,wav,mp4,mp3,txt' # 允许上传的文件类型

# CRUD 生成配置（crud）
crud:
  # 是否在 migrate 尾部自动应用 crud_specs/*.yaml（幂等；漂移时部署以失败红牌暴露，
  # rejected 类变更必须走 business 迁移）。需要让库长期偏离 spec 的团队可显式关闭。
  apply_on_migrate: true

# 终端/安装器命令配置（terminal）
terminal:
  npm_package_manager: 'pnpm'
  install_service_port: '9900'
  commands:
    install:
      yarn:
        cwd: ''
        command: 'npm install -g yarn'
      pnpm:
        cwd: ''
        command: 'npm install -g pnpm'
      ni:
        cwd: ''
        command: 'npm install -g @antfu/ni'
    version:
      npm:
        cwd: ''
        command: 'npm -v'
      cnpm:
        cwd: ''
        command: 'cnpm -v'
      yarn:
        cwd: ''
        command: 'yarn -v'
      pnpm:
        cwd: ''
        command: 'pnpm -v'
      node:
        cwd: ''
        command: 'node -v'
    web-install:
      npm:
        cwd: 'web'
        command: 'npm install'
      cnpm:
        cwd: 'web'
        command: 'cnpm install'
      yarn:
        cwd: 'web'
        command: 'yarn install'
      pnpm:
        cwd: 'web'
        command: 'pnpm install'
      ni:
        cwd: 'web'
        command: 'ni install'
    nuxt-install:
      npm:
        cwd: 'web-nuxt'
        command: 'npm install'
      cnpm:
        cwd: 'web-nuxt'
        command: 'cnpm install'
      yarn:
        cwd: 'web-nuxt'
        command: 'yarn install'
      pnpm:
        cwd: 'web-nuxt'
        command: 'pnpm install'
      ni:
        cwd: 'web-nuxt'
        command: 'ni install'
    web-build:
      npm:
        cwd: 'web'
        command: 'npm run build'
      cnpm:
        cwd: 'web'
        command: 'cnpm run build'
      yarn:
        cwd: 'web'
        command: 'yarn run build'
      pnpm:
        cwd: 'web'
        command: 'pnpm run build'
      ni:
        cwd: 'web'
        command: 'nr build'
    npx:
      prettier:
        cwd: 'web'
        command: 'npx prettier --write %s'
    set-registry:
      npm:
        cwd: ''
        command: 'npm config set registry https://registry.npmjs.org/ && npm config get registry'
      taobao:
        cwd: ''
        command: 'npm config set registry https://registry.npmmirror.com/ && npm config get registry'
      rednpm:
        cwd: ''
        command: 'npm config set registry http://registry.mirror.cqupt.edu.cn/ && npm config get registry'
    ping:
      baidu:
        cwd: ''
        command: 'ping baidu.com'
      localhost:
        cwd: ''
        command: 'ping 127.0.0.1 -n 6'
