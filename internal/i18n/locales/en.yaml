Role remark: To ensure system security, the parent-child relationship of role groups is for reference only; the actual hierarchy is determined by `permission amount`. Two administrators with the same permission nodes are considered `peers`; one containing the other's nodes plus extra permissions is considered `superior`. Peers cannot manage peers; a superior can assign its own permission nodes to subordinates. If an administrator needs to become a `superior` in special cases, a virtual permission node can be created
