Role remark: 爲保障系統安全，角色組本身的上下級關係僅供參考，系統的實際上下級劃分是根據`權限多寡`來確定的，兩位管理員的權限節點：相同被認爲是`同級`、包含且有額外權限才被認爲是`上級`，同級不可管理同級，上級可爲下級分配自己擁有的權限節點；若有特殊情況管理員需轉`上級`，可建立一個虛擬權限節點
Dashboard remark: 開源等於互助；開源需要大家一起來支持，支持的方式有很多種，比如使用、推薦、寫教程、保護生態、貢獻代碼、回答問題、分享經驗、打賞讚助等；歡迎您加入我們！
