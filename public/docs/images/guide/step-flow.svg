<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a919f"/>
    </marker>
  </defs>

  <rect x="30" y="40" width="180" height="100" rx="10" fill="#eef4ff" stroke="#3370ff" stroke-width="1.5"/>
  <text x="120" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2329">编写指南</text>
  <text x="120" y="106" text-anchor="middle" font-size="13" fill="#646a73">HTML + 图片，放在</text>
  <text x="120" y="126" text-anchor="middle" font-size="13" fill="#646a73">public/docs/ 目录</text>

  <line x1="225" y1="90" x2="255" y2="90" stroke="#8a919f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="40" width="180" height="100" rx="10" fill="#f0f9f0" stroke="#34a853" stroke-width="1.5"/>
  <text x="360" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2329">开启服务</text>
  <text x="360" y="106" text-anchor="middle" font-size="13" fill="#646a73">config 中设置</text>
  <text x="360" y="126" text-anchor="middle" font-size="13" fill="#646a73">app.docs_enabled: true</text>

  <line x1="465" y1="90" x2="495" y2="90" stroke="#8a919f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="510" y="40" width="180" height="100" rx="10" fill="#fff8e8" stroke="#f5a623" stroke-width="1.5"/>
  <text x="600" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2329">访问文档</text>
  <text x="600" y="106" text-anchor="middle" font-size="13" fill="#646a73">浏览器打开</text>
  <text x="600" y="126" text-anchor="middle" font-size="13" fill="#646a73">/docs/</text>
</svg>
