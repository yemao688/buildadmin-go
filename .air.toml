#https://github.com/air-verse/air/blob/master/air_example.toml#L8
# Working directory
# . or absolute path, please note that the directories following must be under root.
root = "."
tmp_dir = "runtime/tmp"

[build]
  # pre_cmd = ["cd ./cmd/server && wire.exe"]
  # Just plain old shell command. You could use `make` as well.
  cmd = "go build -o ./runtime/tmp/main ./cmd/server"
  # 不显式传 --conf：main.go 的 --conf 默认值本即根目录 config.yaml；显式传参会置 Changed 标记，
  # 文件缺失时触发硬 panic，导致全新检出/重装向导模式（无 config.yaml 以基座启动 /install）在 air 下无法进入。
  entrypoint = ["./runtime/tmp/main"]
  # Ignore these filename extensions or directories.
  exclude_dir = ["assets", "runtime", "vendor", "test","generate","docs","public","web","tests"]
  # Exclude files.
  exclude_file = ["config.yaml"]
  # Exclude specific regular expressions.
  exclude_regex = ["_test.go",'_gen.go']
  # Watch these filename extensions.
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Watch these directories if you specified.
  include_dir = []
  include_file = []
  # Exclude unchanged files.
  exclude_unchanged = true
  follow_symlink = true
  log = "build-errors.log"
  # It's not necessary to trigger build each time file changes if it's too frequent.
  delay = 10000 # ms
  # Stop running old binary when build errors occur.
  stop_on_error = true
  # Send Interrupt signal before killing process (windows does not support this feature)
  send_interrupt = true
  kill_delay = 50000000 # nanosecond
  # Rerun binary or not
  #rerun = false
  # Delay after each execution
  #rerun_delay = 500

[color]
  # Customize each part's color. If no color found, use the raw app log.
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  # Delete tmp directory on exit
  clean_on_exit = false

[screen]
  clear_on_rebuild = true


[proxy]
